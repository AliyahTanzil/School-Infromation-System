services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sais
      POSTGRES_PASSWORD: sais_password
      POSTGRES_DB: sais
    ports:
      - '5432:5432'
    volumes:
      - sais-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sais -d sais']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sais-postgres-data:
