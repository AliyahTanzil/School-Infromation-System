name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:check -w backend
      - run: npm run db:generate -w backend
      - run: npm test -w backend
      - run: npm run lint -w backend
      - run: npm run format:check -w backend
      - run: npm run test:build -w backend
      - run: npm run build -w frontend
