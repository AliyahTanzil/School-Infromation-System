openapi: 3.0.3
info:
  title: SAIS API
  version: 1.0.0
  description: Contract reference for the implemented SAIS backend routes.
servers:
  - url: /api/v1
    description: Versioned API
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: sais_refresh_token
  schemas:
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details: { nullable: true }
        requestId: { type: string }
    PaginatedResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: { type: object, additionalProperties: true } }
        meta:
          type: object
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200': { description: Healthy }
  /auth/register:
    post:
      summary: Register a tenant administrator
      requestBody:
        required: true
        content:
          application/json:
            {
              schema:
                {
                  type: object,
                  required: [email, password, firstName, lastName],
                  additionalProperties: true,
                },
            }
      responses:
        '201': { description: Created }
        '400':
          {
            description: Validation error,
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
  /auth/login:
    post:
      summary: Authenticate a user
      responses:
        '200': { description: Authenticated }
        '401': { description: Authentication failure }
  /auth/refresh:
    post:
      summary: Rotate a refresh session
      security: [{ refreshCookie: [] }]
      responses:
        '200': { description: Refreshed }
        '401': { description: Invalid or expired refresh session }
  /auth/logout:
    post:
      summary: Revoke current session
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Logged out }
  /students:
    get:
      summary: List tenant students
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          {
            description: Student page,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/PaginatedResponse' } } },
          }
    post:
      summary: Create a tenant student
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Student created }
  /students/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Get a tenant student
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Student }
        '404': { description: Not found }
    patch:
      summary: Update a tenant student
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated }
  /parents/me:
    get:
      summary: Get the authenticated parent's portal
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Parent profile, linked students, preferences, and notifications }
        '401': { description: Authentication required }
        '404': { description: Parent profile not found }
  /parents/me/profile:
    patch:
      summary: Update the authenticated parent's profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                firstName: { type: string }
                lastName: { type: string }
                occupation: { type: string, nullable: true }
                preferredLanguage: { type: string }
      responses:
        '200': { description: Parent profile updated }
        '400': { description: Validation error }
        '401': { description: Authentication required }
        '404': { description: Parent profile not found }
  /parents/me/students:
    post:
      summary: Request a link to a student actively enrolled in the configured school
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, relationship]
              additionalProperties: false
              properties:
                studentId: { type: string, format: uuid }
                relationship: { type: string }
      responses:
        '201': { description: Pending student relationship created }
        '400': { description: Validation error }
        '401': { description: Authentication required }
        '404': { description: Parent or student not found }
  /parents/me/students/{studentId}:
    parameters:
      - name: studentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Revoke a student's link to the authenticated parent
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Student link revoked }
        '401': { description: Authentication required }
        '404': { description: Parent or student link not found }
  /teachers:
    get:
      summary: List teachers in the authenticated tenant and selected school
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: x-school-id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
        - { name: query, in: query, schema: { type: string } }
      responses:
        '200': { description: Tenant-scoped teacher list }
        '401': { description: Authentication required }
        '403': { description: School context or role not permitted }
  /teachers/me:
    get:
      summary: Get the authenticated teacher profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Teacher profile and lifecycle history }
        '401': { description: Authentication required }
        '403': { description: Teacher role required }
        '404': { description: Teacher profile not found }
    post:
      summary: Create a teacher in the authenticated tenant and selected school
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: x-school-id, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Teacher created as an applicant }
        '400': { description: Validation error }
        '403': { description: School context or role not permitted }
  /teachers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: x-school-id, in: header, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get a tenant- and school-scoped teacher
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Teacher record }
        '404': { description: Teacher not found }
  /teachers/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: x-school-id, in: header, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Apply a validated teacher lifecycle transition
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Teacher status changed and history recorded atomically }
        '400': { description: Validation error }
        '404': { description: Teacher not found }
        '422': { description: Invalid lifecycle transition }
  /subjects:
    get:
      summary: List subjects for the authenticated tenant and selected school
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: x-school-id, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: School subject catalog }
        '403': { description: Tenant, school, or role not permitted }
    post:
      summary: Create a school subject
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Subject created }
        '400': { description: Validation error }
  /subjects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: x-school-id, in: header, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get a school subject
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Subject record }
        '404': { description: Subject not found }
    patch:
      summary: Update a school subject
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Subject updated }
  /subjects/{id}/status:
    patch:
      summary: Change subject lifecycle status
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Subject status updated }
  /classes:
    get:
      summary: List class sections for the authenticated tenant and selected school
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated class section catalog }
    post:
      summary: Create a planned class section
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Class section created }
        '400': { description: Invalid or cross-scope academic reference }
  /classes/{id}/status:
    patch:
      summary: Apply a validated class lifecycle transition
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Status changed and history recorded }
        '404': { description: Class not found }
  /classes/{id}/enrollments:
    post:
      summary: Enroll a tenant student into an active class section
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Student enrolled }
        '400': { description: Class inactive or at capacity }
        '404': { description: Class or student not found }
  /attendance:
    get:
      summary: List attendance sessions for the selected school
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated attendance sessions }
    post:
      summary: Create a draft register seeded from active class enrollment
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Attendance session and roster created }
        '404': { description: Class not found }
  /attendance/{id}:
    get:
      summary: Get an attendance register and status summary
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Attendance register }
        '404': { description: Session not found }
  /attendance/{id}/status:
    patch:
      summary: Open, lock, or archive an attendance register
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Session transitioned and audited }
  /attendance/{id}/records/bulk:
    post:
      summary: Mark enrolled students in an open register
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Records updated and action audited }
        '400': { description: Register is not open }
  /academic-policies:
    get:
      summary: List school grading policies and their bands, weights, and history
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: x-school-id, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: School grading policy register }
    post:
      summary: Create a draft grading policy with grade bands and assessment weights
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Draft academic policy created }
        '400': { description: Invalid bands, weights, pass mark, or effective period }
  /academic-policies/{id}:
    get:
      summary: Get a tenant and school scoped grading policy
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Grading policy detail }
        '404': { description: Academic policy not found }
  /academic-policies/{id}/status:
    patch:
      summary: Activate or archive a grading policy
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Policy transitioned and history recorded }
        '400':
          { description: Invalid transition, incomplete weighting, or overlapping active policy }
  /examinations:
    get:
      summary: List examination cycles for the selected school
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Examination cycles with candidate, schedule, and mark counts }
    post:
      summary: Create a draft examination cycle
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Draft examination created }
  /examinations/{id}/candidates:
    post:
      summary: Register an actively enrolled student as an examination candidate
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Candidate registered }
        '400': { description: Student is not enrolled in the selected class }
  /examinations/{id}/schedules:
    post:
      summary: Schedule a school subject for a class in a draft examination
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Subject schedule created }
  /examinations/{id}/status:
    patch:
      summary: Advance the audited examination lifecycle
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Examination status changed }
        '400': { description: Invalid transition or incomplete examination setup }
  /examinations/{id}/marks:
    put:
      summary: Create or update a bounded candidate mark during marking
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Candidate mark stored }
        '400': { description: Mark is out of range, unscheduled, or no longer writable }
  /results:
    get:
      summary: List processed results for a school and optional examination
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Ranked official result records }
  /results/statistics:
    get:
      summary: Return result count, pass count, and average
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Result statistics }
  /results/process:
    post:
      summary: Process locked examination marks with an active grading policy
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Results calculated into review state }
        '400': { description: Examination is unlocked or has incomplete marks }
  /results/{id}/status:
    patch:
      summary: Approve, publish, or lock an official result
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Result status changed and audited }
        '400': { description: Invalid result lifecycle transition }
